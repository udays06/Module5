<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog App</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 780px; margin: 30px auto; padding: 20px; background: #f5f6fa; }
    h1 { text-align: center; }
    nav { text-align: center; margin-bottom: 20px; }
    nav a { margin: 0 10px; color: #2563eb; text-decoration: none; font-weight: bold; }
    section { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    input, textarea, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { padding: 10px 18px; border: none; background: #2563eb; color: white; border-radius: 6px; cursor: pointer; margin-right: 8px; }
    button:hover { background: #1d4ed8; }
    .danger { background: #dc2626; }
    .danger:hover { background: #b91c1c; }
    #message { margin: 10px 0; font-weight: bold; text-align: center; }
    .blog { border-bottom: 1px solid #ddd; padding: 12px 0; }
    .blog a { color: #2563eb; text-decoration: none; font-weight: bold; }
    .category { display: inline-block; background: #e0e7ff; color: #3730a3; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    .filters { display: flex; gap: 10px; }
  </style>
</head>
<body>
  <h1>Blog Application</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="profile.html">Profile</a>
  </nav>

  <div id="message"></div>

  <section>
    <h2>Register</h2>
    <input id="registerName" placeholder="Name" />
    <input id="registerEmail" placeholder="Email" />
    <input id="registerPassword" type="password" placeholder="Password" />
    <button onclick="registerUser()">Register</button>
  </section>

  <section>
    <h2>Login</h2>
    <input id="loginEmail" placeholder="Email" />
    <input id="loginPassword" type="password" placeholder="Password" />
    <button onclick="loginUser()">Login</button>
  </section>

  <section>
    <h2>All Blogs</h2>
    <div class="filters">
      <input id="searchInput" placeholder="Search by title or content" oninput="getBlogs()" />
      <select id="categoryFilter" onchange="getBlogs()">
        <option value="All">All categories</option>
        <option value="Technology">Technology</option>
        <option value="Travel">Travel</option>
        <option value="Food">Food</option>
        <option value="Education">Education</option>
        <option value="General">General</option>
      </select>
    </div>
    <button onclick="getBlogs()">Refresh Blogs</button>
    <div id="blogs"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
